name: RDP
on: workflow_dispatch

jobs:
  rdp-ngrok:
    runs-on: windows-latest
    steps:

    - name: Enable RDP + Disable NLA
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 0 -Force

        netsh advfirewall firewall add rule name="AllowRDP" dir=in action=allow protocol=TCP localport=3389
        
        Restart-Service TermService -Force

    - name: Create RDP User
      run: |
        $password = "P@ssw0rd123!"
        $secure = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

        echo "RDP_USER=RDP" >> $env:GITHUB_ENV
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV

    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Start Ngrok Tunnel (TCP 3389)
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH }}
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow

    - name: Display Connection Info
      shell: pwsh
      run: |
        Start-Sleep -Seconds 5
        $tunnel = (Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels").Content | ConvertFrom-Json
        $addr = $tunnel.tunnels.public_url
        Write-Host "============================"
        Write-Host "     RDP CONNECTION INFO    "
        Write-Host "============================"
        Write-Host "Ngrok TCP: $addr"
        Write-Host "Username: $env:RDP_USER"
        Write-Host "Password: $env:RDP_PASS"
        Write-Host "============================"

    - name: Keep Session Alive
      run: |
        while ($true) {
          Write-Host "RDP Active..."
          Start-Sleep -Seconds 300
        }
